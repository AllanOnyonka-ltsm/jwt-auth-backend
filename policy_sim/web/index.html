<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Policy Simulation Sandbox</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header>
      <h1>Policy Simulation Sandbox</h1>
      <p class="subtitle">
        Explore policy inputs with a toy macro model. Results are illustrative only.
      </p>
    </header>

    <main>
      <section class="panel">
        <h2>Policy Inputs</h2>
        <form id="policy-form">
          <div class="form-grid">
            <label>
              Policy name
              <input type="text" name="name" value="Growth Package" />
            </label>
            <label>
              Simulations
              <input type="number" step="100" name="simulations" value="2000" />
            </label>
            <label>
              Tax change (% GDP)
              <input type="number" step="0.001" name="tax_change" value="-0.01" />
            </label>
            <label>
              Subsidy change (% GDP)
              <input type="number" step="0.001" name="subsidy_change" value="0.005" />
            </label>
            <label>
              Transfer change (% GDP)
              <input type="number" step="0.001" name="transfer_change" value="0.003" />
            </label>
          </div>

          <h3>Model Assumptions</h3>
          <div class="form-grid">
            <label>
              Baseline GDP growth
              <input type="number" step="0.001" name="baseline_gdp_growth" value="0.02" />
            </label>
            <label>
              Baseline inflation
              <input type="number" step="0.001" name="baseline_inflation" value="0.03" />
            </label>
            <label>
              Baseline poverty rate
              <input type="number" step="0.001" name="baseline_poverty_rate" value="0.15" />
            </label>
            <label>
              Fiscal multiplier
              <input type="number" step="0.05" name="fiscal_multiplier" value="0.9" />
            </label>
            <label>
              Inflation sensitivity
              <input type="number" step="0.05" name="inflation_sensitivity" value="0.4" />
            </label>
            <label>
              Poverty elasticity
              <input type="number" step="0.05" name="poverty_elasticity" value="-0.6" />
            </label>
            <label>
              Transfer poverty effect
              <input type="number" step="0.05" name="transfer_poverty_effect" value="-0.3" />
            </label>
            <label>
              GDP shock std.
              <input type="number" step="0.001" name="shock_std_gdp" value="0.01" />
            </label>
            <label>
              Inflation shock std.
              <input type="number" step="0.001" name="shock_std_inflation" value="0.008" />
            </label>
            <label>
              Shock correlation
              <input type="number" step="0.05" name="shock_correlation" value="0.35" />
            </label>
          </div>
          <button type="submit">Run simulation</button>
        </form>
      </section>

      <section class="panel">
        <h2>Summary</h2>
        <div id="assumptions"></div>
        <div id="summary"></div>
        <h3>MEAL context warnings</h3>
        <ul id="warnings"></ul>
        <h3>Model notes</h3>
        <ul id="notes"></ul>
      </section>

      <section class="panel">
        <h2>Pseudo indicators</h2>
        <div id="indicators"></div>
      </section>
    </main>

    <footer>
      <p>Prototype UI. Not intended for policy decisions.</p>
    </footer>

    <script src="/static/app.js"></script>
  </body>
</html>
